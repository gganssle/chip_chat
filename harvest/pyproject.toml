[project]
name = "chip-chat-harvest"
version = "0.0.0"
description = "Public menu, nutrition, and policy ingestion."
requires-python = ">=3.13"
dependencies = [
    # Entra ID tokens for Document Intelligence. No key is ever read: the
    # deployed container uses its user-assigned managed identity and a
    # developer uses `az login`, both through DefaultAzureCredential.
    "azure-identity>=1.19",
    "chip-chat-otel",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-otel = { workspace = true }
