[project]
name = "chip-chat-eval"
version = "0.0.0"
description = "Golden set, adversarial suite, Arize experiments."
requires-python = ">=3.13"
# The labeled photo set runs the real photo lane over real frames, so it holds
# the vision package rather than a copy of its shapes; the catalogue for the
# rows stage 5 resolves against, and harvest for the blob store that reads a
# built catalogue off disk. An eval that re-implemented any of them would be
# scoring something other than the pipeline.
#
# The golden set holds `agent` for the same reason and a second one. It scores
# the agent, so the first thing on the far side of its `Deployment` seam is the
# real loop rather than a re-implementation of it; and the citation rule it
# checks is `chip_chat.agent.envelope`'s -- a citation is an id the retriever
# returned, and a copy of that rule here could disagree with the renderer.
# One way only: nothing in `agent/` imports `eval`.
#
# The retrieval eval holds `search` for the third version of the same reason,
# and it is the sharpest one. Issue #50's ablation runs the retriever in
# configurations the product never sends -- keyword only, vector only -- and an
# eval that built those request bodies itself would be measuring a copy of
# `chip_chat.search.query` rather than `chip_chat.search.query`. So the halves
# are expressible in that module, behind an argument that says who may pass
# them, and the eval calls the real `Retriever`.
#
# `api` is the fourth, and it arrives with the adversarial suite's second front,
# #83. The second launch gate is enforced in `chip_chat.api.ops`, and a red team
# that attacked a copy of that rule would be scoring the copy: the whole claim
# is that the refusal is in the code rather than in a template, so the thing on
# the far side of `chip_chat.eval.adversarial.gate2`'s seam has to be the real
# service. Same direction as every other entry -- nothing in `api/` imports
# `eval`.
dependencies = [
    "chip-chat-agent",
    "chip-chat-api",
    "chip-chat-catalog",
    "chip-chat-harvest",
    "chip-chat-otel",
    "chip-chat-search",
    "chip-chat-vision",
]

# The `arize` SDK is deliberately absent, and this is the note that stops it
# being added back without the argument. `chip_chat.eval.dataset.store` uploads
# through it and imports it inside the method that needs it, so everything else
# -- building the dataset, versioning it, checking the committed build in CI --
# works without it.
#
# Adding it, as a dependency or as an extra, is not free: `uv` resolves one
# universal lock for the workspace, and `arize` constrains protobuf hard enough
# to drag the whole tree from 7.x back to 6.x. Paying that on every install, in
# CI included, to make one command shorter for the one person running it is the
# wrong trade. `eval/dataset/README.md` documents the command:
#
#     uv run --with arize python -m chip_chat.eval.dataset --upload
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-agent = { workspace = true }
chip-chat-api = { workspace = true }
chip-chat-catalog = { workspace = true }
chip-chat-harvest = { workspace = true }
chip-chat-otel = { workspace = true }
chip-chat-search = { workspace = true }
chip-chat-vision = { workspace = true }
