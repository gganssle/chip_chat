[project]
name = "chip-chat-catalog"
version = "0.0.0"
description = "The consolidated menu catalogue: the single source of truth for what is orderable."
requires-python = ">=3.13"
dependencies = [
    "chip-chat-harvest",
    "chip-chat-otel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-harvest = { workspace = true }
chip-chat-otel = { workspace = true }
