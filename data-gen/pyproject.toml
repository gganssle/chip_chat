[project]
name = "chip-chat-data-gen"
version = "0.0.0"
description = "Seeded synthetic account generator."
requires-python = ">=3.13"
dependencies = [
    "chip-chat-catalog",
    "chip-chat-otel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

# population.toml is not documentation: `load_config()` reads it out of the
# installed package, so it has to ship inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/chip_chat/data_gen/population.toml" = "chip_chat/data_gen/population.toml"

[tool.uv.sources]
chip-chat-catalog = { workspace = true }
chip-chat-otel = { workspace = true }
