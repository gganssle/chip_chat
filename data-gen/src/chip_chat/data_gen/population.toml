# The tuned population.
#
# Issue #25's fourth acceptance criterion: "generation parameters live in a
# config file, not scattered constants, so the population can be retuned
# without archaeology". This is that file. Every number the generator reads is
# here, and `chip_chat.data_gen.config` validates all of them rather than
# clamping any of them.
#
# PRD section 09 calls account realism "bounded by the generator", which makes
# this a product surface: behaviour absent from the archetypes below cannot be
# demonstrated by the assistant, however well the rest of the pipeline works.
# Adding "the customer who only ever orders catering" is an edit here.

[population]
seed = 20260826
customers = 500
stores = 30
months = 18
# Fixed rather than "now". A generator whose window depends on the wall clock
# is not reproducible whatever its seed says.
ends_at = "2026-08-01T00:00:00+00:00"
# Traffic is not spread evenly over thirty stores in the real world and should
# not be here: the exponent concentrates it, the offset keeps the busiest store
# busy rather than the only one busy.
store_popularity_exponent = 0.85
store_popularity_offset = 2.5
# How sharply one customer prefers some items over others. A Dirichlet
# concentration: below one gives most customers a few favourites, at one they
# have none, and a population with no favourites gives the personalization
# lane nothing to find.
palate_concentration = 0.55
# How far a customer's first and last order may slide from where their
# archetype's shares put them. Without it every lapsed customer lapses on the
# same afternoon, which reads as a generator rather than as a population.
window_jitter_days = 21
# How many exemplar customers each archetype contributes to `persona_fixtures`.
# Issue #26 asks for "more than three concrete instances of each archetype, so
# persona switching shows variety rather than the same three accounts", so four
# is the floor and not a preference. An archetype whose customers cannot supply
# four that clear its `[personas.fixture]` bounds contributes the ones it has
# rather than promoting one that fails its own test; `test_fixtures.py` asserts
# this population is not one of those.
fixtures_per_persona = 4

[timing]
# Monday first. Friday is the peak, Sunday the trough.
day_of_week_weights = [0.155, 0.150, 0.145, 0.150, 0.170, 0.130, 0.100]
# January first. Multipliers around one: a month above one shortens the gap
# between a customer's orders, a month below one lengthens it. This is the
# seasonal drift, and it is why an 18-month window is not 18 identical months.
month_weights = [0.90, 0.94, 1.02, 1.06, 1.10, 1.07, 1.04, 1.08, 1.06, 1.02, 0.95, 0.86]
# How far an order may be moved to land on a better-weighted weekday.
weekday_shift_days = 3
# Assumed hours for a store that publishes none. The locator publishes hours
# for most stores and not all, and an order at 3am in a store whose hours are
# simply missing is worse than an order inside a stated assumption.
default_opens = "10:45"
default_closes = "22:00"
# An order this close to closing is pulled back inside the published hours.
last_order_minutes = 15

[timing.store_timezones]
# The locator publishes opening hours with no zone on them. They are local
# times, and so is "weekday lunch peak", so the store has to name a zone
# before either claim means anything. Keyed by the published `stores.region`,
# a US state abbreviation. A state split across two zones is mapped to the one
# most of its restaurants are in -- Florida to Eastern, Idaho to Mountain --
# which is an approximation this table makes visible rather than hides. When
# the locator harvest carries a store's own zone, this table goes away.
