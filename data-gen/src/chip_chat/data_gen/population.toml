toppings_max = 4
side_probability = 0.30
drink_probability = 0.35
extra_probability = 0.22
store_loyalty = 0.55
delivery_share = 0.20

# What makes a customer of this archetype worth showing a visitor (issue #26).
# A candidate must clear EVERY bound; there is no scoring, because the ticket's
# rule is absolute -- "if a fixture cannot demonstrate its own metric, it is
# not finished" -- and a weighted score would let a regular with no usual place
# well by ordering a lot. `rank_by` orders the ones that qualify, highest
# first; a leading `-` reads it lowest first. Bounds and `rank_by` may name any
# measure in `chip_chat.data_gen.config.MEASURES`; a name outside it is a
# ConfigError rather than a bound that quietly never bites.
[personas.fixture]
# The PRD's Explorer, measured by whether answers are correct, sourced and
# appropriately hedged. The bound is inverted on purpose: a LOW `usual_share`
# is the qualification, because a customer with no dominant order is what
# exercises the honest "I am not sure what your usual is" path. Ranking by
# `-usual_share` puts the least predictable customer first.
rank_by = "-usual_share"
narrative = "{order_count} orders across {distinct_stores} stores and {distinct_baskets} different baskets among them; the nearest thing to a usual is {usual_order}, and that is only {usual_share:.0%} of them."

[personas.fixture.at_least]
order_count = 20
distinct_stores = 5
distinct_baskets = 20

[personas.fixture.at_most]
usual_share = 0.15

