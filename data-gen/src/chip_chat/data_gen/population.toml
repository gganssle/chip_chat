# Deliberately says nothing about points, and now for a reason about the
# persona rather than about a bug. It used to say nothing because this
# archetype's balance was an artefact: the ledger let a customer redeem at
# most once per visit, so one earning more per visit than the costliest
# reward costs could never drain it, and every office manager sat on tens of
# thousands of points (cc-5si). That cap is gone -- nothing published imposed
# it -- and this archetype's eagerness is retuned above. What the fixture is
# here to demonstrate is still group ordering, which is what `rank_by` picks.
narrative = "puts in the floor's lunch order at {store}: {order_count} orders averaging {entrees_per_order:.1f} entrees, ${lifetime_spend:,.0f} in all."

