[catalogue]
# Published `menu_items.category` values. A catalogue whose category names
# change is a config edit, not a code change.
entree_category = "Entree"
side_categories = ["Side"]
drink_categories = ["Drink"]
# Published, orderable in principle, and noise in a basket.
excluded_categories = ["Non Food Items"]
# `modifiers.modifier_type` marking a paid extra portion.
extra_portion_modifier_type = "ExtraPortion"
# Slots the catalogue publishes as one-of; the generator always picks one.
required_slots = ["rice", "beans"]
# Slots the generator picks a variable number from.
optional_slots = ["toppings", "salsas"]

[orders]
statuses = ["COMPLETED", "CANCELLED", "REFUNDED"]
status_weights = [0.958, 0.028, 0.014]
# A refunded order is real history and earns nothing.
settled_statuses = ["COMPLETED"]

[loyalty]
# No arithmetic. Issue #27 took `points_per_dollar` and `redemption_threshold`
# out of this file: the earn rate, the expiry window, the daily cap on earning
# purchases and every redemption price are read from Chipotle's own published
# rewards terms by `chip_chat.data_gen.rewards`, which refuses to run when it
# cannot find them published. A key here that could disagree with the published
# programme is a key that eventually will, so `config.PUBLISHED_KEYS` rejects
# both of them rather than ignoring them.
#
# What is left is vocabulary and behaviour. How eager an archetype is to spend
# is `redemption_probability`, on the archetype, because the Lapsed Regular's
# unredeemed balance is a property of that archetype and not of the programme.
seed_reason = "SIGNUP_BONUS"
earn_reason = "ORDER"
# What was redeemed is `loyalty_ledger.reward_name`, taken verbatim off the
# published Rewards Exchange row. The reason column says only what kind of
# movement this is, which is why it no longer names a particular reward.
redeem_reason = "REWARD_REDEEMED"
expiry_reason = "POINTS_EXPIRED"
# Share of redemptions that take the best reward the balance covers. The rest
# are drawn from the whole affordable line-up, so that a customer with 2,000
# points sometimes still buys chips.
splurge_share = 0.72

[names]
# Invented words combined by seed. There is no PII in this system by
