[timing.weekday_lunch]
hours = [10, 11, 12, 13, 14, 15]
weights = [0.05, 0.22, 0.38, 0.22, 0.09, 0.04]

[timing.weekday_dinner]
hours = [16, 17, 18, 19, 20, 21]
weights = [0.08, 0.22, 0.30, 0.22, 0.12, 0.06]

[timing.weekend_lunch]
hours = [10, 11, 12, 13, 14, 15]
weights = [0.04, 0.15, 0.28, 0.27, 0.16, 0.10]

[timing.weekend_dinner]
hours = [16, 17, 18, 19, 20, 21]
weights = [0.10, 0.20, 0.26, 0.22, 0.14, 0.08]

[catalogue]
# Published `menu_items.category` values. A catalogue whose category names
# change is a config edit, not a code change.
entree_category = "Entree"
side_categories = ["Side"]
drink_categories = ["Drink"]
# Published, orderable in principle, and noise in a basket.
excluded_categories = ["Non Food Items"]
# `modifiers.modifier_type` marking a paid extra portion.
extra_portion_modifier_type = "ExtraPortion"
# Slots the catalogue publishes as one-of; the generator always picks one.
required_slots = ["rice", "beans"]
# Slots the generator picks a variable number from.
optional_slots = ["toppings", "salsas"]

[orders]
statuses = ["COMPLETED", "CANCELLED", "REFUNDED"]
status_weights = [0.958, 0.028, 0.014]
# A refunded order is real history and earns nothing.
settled_statuses = ["COMPLETED"]

[loyalty]
# No arithmetic. Issue #27 took `points_per_dollar` and `redemption_threshold`
# out of this file: the earn rate, the expiry window, the daily cap on earning
# purchases and every redemption price are read from Chipotle's own published
# rewards terms by `chip_chat.data_gen.rewards`, which refuses to run when it
# cannot find them published. A key here that could disagree with the published
# programme is a key that eventually will, so `config.PUBLISHED_KEYS` rejects
# both of them rather than ignoring them.
#
# What is left is vocabulary and behaviour. How eager an archetype is to spend
# is `redemption_probability`, on the archetype, because the Lapsed Regular's
# unredeemed balance is a property of that archetype and not of the programme.
seed_reason = "SIGNUP_BONUS"
earn_reason = "ORDER"
# What was redeemed is `loyalty_ledger.reward_name`, taken verbatim off the
# published Rewards Exchange row. The reason column says only what kind of
# movement this is, which is why it no longer names a particular reward.
redeem_reason = "REWARD_REDEEMED"
expiry_reason = "POINTS_EXPIRED"
# Share of redemptions that take the best reward the balance covers. The rest
# are drawn from the whole affordable line-up, so that a customer with 2,000
# points sometimes still buys chips.
splurge_share = 0.72

[names]
# Invented words combined by seed. There is no PII in this system by
# construction (RFC-001 section 02) and there is none here either.
given = [
    "Ada", "Amara", "Ansel", "Beatriz", "Bo", "Caleb", "Camille", "Cyrus",
    "Dara", "Dmitri", "Elena", "Emeka", "Esme", "Farid", "Freya", "Gita",
    "Hana", "Hollis", "Ines", "Ivo", "Jonas", "Juno", "Kaia", "Kenji",
    "Lena", "Lio", "Maeve", "Mateo", "Nadia", "Nils", "Odile", "Omar",
    "Paloma", "Pierce", "Quinn", "Rafa", "Rosalind", "Sanne", "Silas",
    "Tamsin", "Theo", "Ula", "Viggo", "Wren", "Xiomara", "Yusuf", "Zara", "Zev",
]
family = [
    "Abara", "Beck", "Calloway", "Duarte", "Eiler", "Farrow", "Gallego",
    "Halloran", "Iyer", "Janek", "Kovac", "Lindqvist", "Marchetti", "Nakamura",
    "Oyelaran", "Pryce", "Quilliam", "Ramone", "Salter", "Tavares", "Ubeda",
    "Vasquez", "Whitlock", "Xu", "Yardley", "Zaman", "Ashworth", "Bordelon",
    "Castellan", "Dunmore", "Espinoza", "Fenwick", "Grieve", "Hartnell",
    "Ilves", "Joubert", "Kestrel", "Larkin", "Moraes", "Nordahl",
]
# Free text a visitor may have typed about themselves. Deliberately about
# preference rather than about medical need: an allergen answer comes from the
# published chart, never from a sentence a visitor wrote.
stated_preferences = [
    "extra guac, always",
    "no rice",
    "keep it mild",
    "as spicy as it comes",
    "double protein when I am training",
    "vegetarian on weekdays",
    "no onions",
    "I always want it to go",
]
stated_preference_share = 0.22
home_store_override_share = 0.08

# --------------------------------------------------------------------------
# The archetypes. Shares sum to one; the population is apportioned by largest
# remainder, so five hundred customers split the same way every run.
# --------------------------------------------------------------------------

[[personas]]
persona_id = "regular"
label = "The Weekly Regular"
narrative = "Same bowl, same store, the same day nearly every week, for as long as the data goes back."
share = 0.16
seed_points = 250
# Spends what they earn, more or less as they earn it.
redemption_probability = 0.55
cadence_days = 7.0
cadence_spread = 0.12
active_from_share = 0.0
active_until_share = 1.0
usual_order_fidelity = 0.92
weekday_fidelity = 0.85
# Each regular keeps to one day; which day is drawn per customer from
# `day_of_week_weights`. Pinning the whole archetype to Tuesday would put a
# third of the population's orders on Tuesday, which is a generator showing
# through rather than a regular.
preferred_weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
lunch_share = 0.80
entrees_min = 1
entrees_max = 1
toppings_min = 2
toppings_max = 3
side_probability = 0.10
drink_probability = 0.25
extra_probability = 0.05
store_loyalty = 0.97
delivery_share = 0.08

