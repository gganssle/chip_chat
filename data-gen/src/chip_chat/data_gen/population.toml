# --------------------------------------------------------------------------
# What "the population is not thin" means, in numbers (issue #28).
#
# Trap 1 in the system design. A thin population generates, prices, writes and
# passes referential integrity; it is simply useless, because personalization
# has nothing to find in it. `chip_chat.data_gen.texture` measures every check
# below on EVERY generation and raises rather than warns, so a degenerate
# population never reaches a landing zone.
#
# Every bound is RELATIVE TO WHAT THE CATALOGUE MAKES POSSIBLE -- a coverage, a
# ratio, a share or an effect size -- never a count of foods. That is what lets
# one set of numbers be meaningful against the committed nine-item fixture
# catalogue and against a real harvest at the same time: "twelve entrees were
# ordered" is a claim about Chipotle's menu, and "every entree the catalogue
# publishes was ordered by somebody" is a claim about this generator. Issues
# #25 and #26 both declined to assert food variety for exactly this reason and
# both named #28 as the ticket that would settle it.
#
# Every name in `chip_chat.data_gen.config.TEXTURE_CHECKS` must appear exactly
# once below. A name that is not in it is refused, and so is one that is
# missing: a measured property with no bound is reported and never fails,
# which is indistinguishable from a check that passed.
# --------------------------------------------------------------------------

[texture]
# What the questions mean. Moving one of these changes what is being asked,
# not how demanding the answer has to be.
#
# Ninety days of silence is a lapse. Read against the window's fixed end, never
# against the wall clock -- a lapsed customer who lapses further every day is
# not a reproducible measurement. It is the same bar `[personas.fixture]` holds
# the Lapsed Customer to, deliberately: a population whose lapsed customers
# cannot clear the fixture criteria has none worth showing anyone.
lapsed_after_days = 90
# A first order this recent makes somebody new. Matches the Newcomer fixture's
# ceiling for the same reason.
new_within_days = 200
# A customer repeating their commonest basket this rarely has no usual at all,
# and is the one the assistant has to say "I am not sure what your usual is"
# to. That path is a feature (PRD section 02's Explorer), so the population has
# to contain people who exercise it.
no_usual_above = 0.20
# And this often is a usual dominant enough to reorder in a single turn, which
# is the Regular's whole demonstration.
strong_usual_above = 0.60

[texture.at_least]
# Not everyone is a weekly regular: the busiest tenth of customers order at
# least three times as often as the quietest tenth.
order_frequency_ratio = 3.0
# Everything this catalogue makes orderable was ordered by somebody. Not 1.0:
# a real harvest publishes seasonal items that a fixed eighteen-month window
# can legitimately miss a couple of, and failing the build for that would be
# failing it for Chipotle's menu rather than for the generator.
item_coverage = 0.95
# More than one protein is chosen. This is the food-variety claim in the form
# that survives a small catalogue -- the fixture publishes two proteins and a
# real harvest publishes six, and "all of them" means both.
protein_coverage = 0.90
# There is something for `item_affinity` to learn: a typical customer's item
# mix sits at least this many bits (Jensen-Shannon) from the population's.
# Zero would mean everybody orders the population average, which is the thin
# population this whole section exists to catch. The long tail is measured
# here rather than on the aggregate popularity curve because that curve's
# shape is capped by the catalogue -- nine orderable items cannot produce a
# long tail whatever the customers do -- while this is not.
palate_divergence = 0.015
# `usual_order` confidence varies meaningfully: at least this much between the
# tenth and ninetieth percentile.
usual_share_spread = 0.40
# And both ends of it are populated. Both bounds, not one: a population where
# nobody has a usual cannot demonstrate the one-turn reorder, and one where
# everybody does cannot demonstrate the honest hedge.
without_a_usual = 0.10
with_a_usual = 0.10
# Basket sizes vary between one bowl and a floor's lunch order.
basket_size_ratio = 3.0
# The same item is built differently by different people: this share of lines
# carry a number of modifiers other than the commonest.
modifier_variety = 0.25
# Every store on the roster took at least one order. A store nobody has
# ordered from is a store the assistant can say nothing about.
store_coverage = 1.0
# Traffic is uneven -- the busiest store took at least twice the orders of the
# quietest. A population with no busy store has no busy store to talk about.
store_concentration = 2.0
# A meaningful fraction of customers are lapsed, and a meaningful fraction are
# new. Measured on silence and on recency rather than on `persona_id`, which
# is the version of the question the assistant can actually see: nothing
# downstream reads the archetype label.
lapsed_share = 0.05
new_share = 0.05
# Spend is not clustered around a single mean. The ratio says it is spread and
# the skew says it LEANS, which is the claim -- a symmetric distribution wide
# enough clears the ratio on its own.
spend_ratio = 4.0
spend_skew = 0.50
# Every pair of archetypes can be told apart. Cliff's delta on the best
# measure available to the WORST-separated pair, so five good pairs cannot
# hide a sixth that is indistinguishable. 0.8 is a large effect by the usual
# reading; the shipped population scores 1.0, which is complete separation.
# This is the check the ticket is really about: a population can have a wide
# spread on every measure above and still be one blob with seven names on it.
persona_separation = 0.80
# Every ordered line resolves to a published catalogue row -- the second half
# of the system design's demo bar, asserted on every generation rather than
# only under pytest. Exactly 1.0, because one invented menu item is the
# failure the entire pipeline is arranged to make impossible.
catalogue_resolution = 1.0
# Every allergen-disclosure state the ORDERABLE menu carries is ordered by
# somebody. Catalogue-relative on purpose: whether a NOT_PUBLISHED food exists
# is Chipotle's decision, and what the generator owes is to order across
# whatever states exist. A population that only ever ordered items with
# published allergen data would look healthy on every count above while never
# exercising the honest "Chipotle does not publish this" answer.
allergen_state_coverage = 1.0

[texture.at_most]
# Uneven PLAUSIBLY. `store_concentration` alone is cleared just as well by one
# store taking every order as by thirty stores with a plausible head, and the
# first of those is a thin population wearing the shape of a varied one.
busiest_store_share = 0.35

# --------------------------------------------------------------------------
# The archetypes. Shares sum to one; the population is apportioned by largest
# remainder, so five hundred customers split the same way every run.
# --------------------------------------------------------------------------

[[personas]]
persona_id = "regular"
label = "The Weekly Regular"
narrative = "Same bowl, same store, the same day nearly every week, for as long as the data goes back."
share = 0.16
seed_points = 250
# Spends what they earn, more or less as they earn it.
redemption_probability = 0.55
cadence_days = 7.0
cadence_spread = 0.12
active_from_share = 0.0
active_until_share = 1.0
usual_order_fidelity = 0.92
weekday_fidelity = 0.85
# Each regular keeps to one day; which day is drawn per customer from
# `day_of_week_weights`. Pinning the whole archetype to Tuesday would put a
# third of the population's orders on Tuesday, which is a generator showing
# through rather than a regular.
preferred_weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
lunch_share = 0.80
entrees_min = 1
entrees_max = 1
toppings_min = 2
toppings_max = 3
side_probability = 0.10
drink_probability = 0.25
extra_probability = 0.05
store_loyalty = 0.97
delivery_share = 0.08

# What makes a customer of this archetype worth showing a visitor (issue #26).
# A candidate must clear EVERY bound; there is no scoring, because the ticket's
# rule is absolute -- "if a fixture cannot demonstrate its own metric, it is
# not finished" -- and a weighted score would let a regular with no usual place
# well by ordering a lot. `rank_by` orders the ones that qualify, highest
# first; a leading `-` reads it lowest first. Bounds and `rank_by` may name any
# measure in `chip_chat.data_gen.config.MEASURES`; a name outside it is a
# ConfigError rather than a bound that quietly never bites. A bound's VALUE is
# a number chosen here or a name from `PUBLISHED_BOUNDS`, read off Chipotle's
# published terms -- for a criterion that is a fact about their programme
# rather than a decision of ours.
[personas.fixture]
# The PRD's Regular, measured by turns-to-reorder with a target of one. That
# target is only reachable if the usual is unambiguous, so the bar is the usual
# itself: at least six orders in seven are the identical basket.
rank_by = "usual_share"
narrative = "a regular at {store}, {points_balance:,} points on the card, and {usual_share:.0%} of {order_count} orders the same {usual_order}."

[personas.fixture.at_least]
order_count = 30
usual_share = 0.85
store_share = 0.90

[[personas]]
persona_id = "lapsed"
label = "The Lapsed Regular"
narrative = "Ordered steadily for a year, then stopped about four months ago."
share = 0.12
seed_points = 180
# The point of this archetype: eighteen months of earning and almost no
# spending, so the balance is still there to be surfaced unprompted.
redemption_probability = 0.04
cadence_days = 9.0
cadence_spread = 0.30
active_from_share = 0.0
# 1 - 4/18. The lapse is a property of the window, not of a hard-coded date.
active_until_share = 0.778
usual_order_fidelity = 0.70
weekday_fidelity = 0.25
lunch_share = 0.55
entrees_min = 1
entrees_max = 2
toppings_min = 1
toppings_max = 3
side_probability = 0.18
drink_probability = 0.30
extra_probability = 0.06
store_loyalty = 0.90
delivery_share = 0.15

# What makes a customer of this archetype worth showing a visitor (issue #26).
# A candidate must clear EVERY bound; there is no scoring, because the ticket's
# rule is absolute -- "if a fixture cannot demonstrate its own metric, it is
# not finished" -- and a weighted score would let a regular with no usual place
# well by ordering a lot. `rank_by` orders the ones that qualify, highest
# first; a leading `-` reads it lowest first. Bounds and `rank_by` may name any
# measure in `chip_chat.data_gen.config.MEASURES`; a name outside it is a
# ConfigError rather than a bound that quietly never bites. A bound's VALUE is
# a number chosen here or a name from `PUBLISHED_BOUNDS`, read off Chipotle's
# published terms -- for a criterion that is a fact about their programme
# rather than a decision of ours.
[personas.fixture]
# The PRD's Lapsed Customer, measured by whether stored value is surfaced
# before they think to ask. Both halves are required: months of silence AND a
# balance worth mentioning. Silence alone is a customer with nothing to
# surface, and points alone is a customer who was in last week.
#
# `points_balance` is READ, not chosen. It was first written here as the
# literal 1250 -- a copy of `[loyalty].redemption_threshold`, deliberately not
# a reference to it, so that issue #27 retuning the arithmetic could not
# silently move the fixture criteria. Issue #27 did not retune the number, it
# DELETED it: the earn rate and every reward price are now read off Chipotle's
# published terms, and the copy outlived the thing it was a copy of.
#
# `costliest_reward` is the published price of the most expensive thing on the
# Rewards Exchange, and it is the bar `RewardsTerms.costliest` already names in
# its own docstring as what "a balance worth surfacing unprompted" is measured
# against. A Lapsed Customer who clears it has a free entree waiting that they
# never claimed, which is exactly what PRD requirement P3 surfaces unasked.
# There is no number here to retune, which is the point.
rank_by = "points_balance"
narrative = "a regular at {store} until {last_order_month}, and not seen since -- {points_balance:,} points still unredeemed from {order_count} orders."

[personas.fixture.at_least]
order_count = 20
days_since_order = 90
points_balance = "costliest_reward"

[[personas]]
persona_id = "explorer"
label = "The Explorer"
narrative = "Rarely orders the same thing twice, and rarely from the same store."
share = 0.18
