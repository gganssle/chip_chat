# measure in `chip_chat.data_gen.config.MEASURES`; a name outside it is a
# ConfigError rather than a bound that quietly never bites.
[personas.fixture]
# Out of scope for V0 as a persona, in scope as data: issue #26 asks that the
# group orderer "shape the generated data so that nothing has to be regenerated
# when it arrives". A fixture that already demonstrates multi-entree ordering
# is that shaping made checkable.
rank_by = "entrees_per_order"
# Deliberately says nothing about points. This archetype outspends the
# redemption rule -- `[loyalty]` lets a customer redeem at most once per
# order, so one earning more than `redemption_threshold` per visit
# accumulates a balance no real programme would show. It is the
# provisional arithmetic issue #27 reconciles (filed as a bead against
# it), and what this fixture is here to demonstrate is group ordering.
narrative = "puts in the floor's lunch order at {store}: {order_count} orders averaging {entrees_per_order:.1f} entrees, ${lifetime_spend:,.0f} in all."

[personas.fixture.at_least]
order_count = 20
entrees_per_order = 4.0

