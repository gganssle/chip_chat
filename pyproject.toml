[project]
name = "chip-chat"
version = "0.0.0"
description = "Cilantro, a conversational assistant for a fast-casual restaurant."
requires-python = ">=3.13"
dependencies = [
    "chip-chat-agent",
    "chip-chat-api",
    "chip-chat-catalog",
    "chip-chat-data-gen",
    "chip-chat-databricks",
    "chip-chat-eval",
    "chip-chat-harvest",
    "chip-chat-infra",
    "chip-chat-otel",
    "chip-chat-snowflake",
    "chip-chat-vision",
    "chip-chat-web",
]

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

# ---------------------------------------------------------------------------
# Workspace. One lockfile at the root; every directory below is a member.
# ---------------------------------------------------------------------------

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "agent",
    "api",
    "catalog",
    "data-gen",
    "databricks",
    "eval",
    "harvest",
    "infra",
    "otel",
    "snowflake",
    "vision",
    "web",
]

[tool.uv.sources]
chip-chat-agent = { workspace = true }
chip-chat-api = { workspace = true }
chip-chat-catalog = { workspace = true }
chip-chat-data-gen = { workspace = true }
chip-chat-databricks = { workspace = true }
chip-chat-eval = { workspace = true }
chip-chat-harvest = { workspace = true }
chip-chat-infra = { workspace = true }
chip-chat-otel = { workspace = true }
chip-chat-snowflake = { workspace = true }
chip-chat-vision = { workspace = true }
chip-chat-web = { workspace = true }

# ---------------------------------------------------------------------------
# ruff — formatter and linter, both.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 90
src = [
    "agent/src",
    "api/src",
    "catalog/src",
    "data-gen/src",
    "databricks/src",
    "eval/src",
    "harvest/src",
    "infra/src",
    "otel/src",
    "snowflake/src",
    "vision/src",
    "web/src",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "PT",     # flake8-pytest-style
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # ruff-specific
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]
# The span helpers nest to mirror the span tree, and those tests assert on that
# tree. Flattening the `with` blocks would hide the very shape under test, and
# where a `pytest.raises` sits between two helpers it would change the meaning.
"otel/tests/*" = ["S101", "SIM117"]
# smoke.py and boundary.py are written as the span trees they emit, for the same
# reason. Combining their `with` statements would flatten the one thing those
# files exist to show -- and in boundary.py the nesting is also where the process
# boundary sits, which is the point of the file.
"otel/src/chip_chat/otel/smoke.py" = ["SIM117"]
"otel/src/chip_chat/otel/boundary.py" = ["SIM117"]
# Databricks notebooks are source files here but modules nowhere: they run on a
# Spark driver that injects `spark` and `dbutils` into the global namespace, and
# the `# COMMAND ----------` separators are load-bearing. Formatting and the rest
# of the lint rules still apply — only the undefined-name rule is lifted, because
# the names really are defined, just not by this file.
"databricks/notebooks/*.py" = ["F821"]

# ---------------------------------------------------------------------------
# mypy — strict on otel/ and agent/, checked everywhere.
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    # Shared test helpers live beside the tests that use them, and pytest puts
    # that directory on sys.path. Mypy needs telling separately.
    "catalog/tests",
    "harvest/tests",
    "agent/src",
    "api/src",
    "catalog/src",
    "data-gen/src",
    "databricks/src",
    "eval/src",
    "harvest/src",
    "infra/src",
    "otel/src",
    "snowflake/src",
    "vision/src",
    "web/src",
]
# Same reason as the ruff ignore above: a notebook is not importable off the
# driver, and `spark`/`dbutils` have no stubs to check it against.
exclude = ["^databricks/notebooks/"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# pillow-heif is the HEIC decoder and ships no py.typed. It is used in exactly
# one place -- `chip_chat.vision.decoders` calls `register_heif_opener()` for its
# side effect -- so there is nothing here for a stub to buy.
[[tool.mypy.overrides]]
module = ["pillow_heif.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["chip_chat.otel.*", "chip_chat.agent.*"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true

# ---------------------------------------------------------------------------
# import-linter — otel/ is a leaf. Nothing in it may import a sibling package.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["chip_chat"]

[[tool.importlinter.contracts]]
name = "otel is a shared leaf library"
type = "forbidden"
source_modules = ["chip_chat.otel"]
forbidden_modules = [
    "chip_chat.agent",
    "chip_chat.api",
    "chip_chat.catalog",
    "chip_chat.data_gen",
    "chip_chat.databricks",
    "chip_chat.eval",
    "chip_chat.harvest",
    "chip_chat.infra",
    "chip_chat.snowflake",
    "chip_chat.vision",
    "chip_chat.web",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = [
    "agent/tests",
    "api/tests",
    "catalog/tests",
    "data-gen/tests",
    "databricks/tests",
    "eval/tests",
    "harvest/tests",
    "infra/tests",
    "otel/tests",
    "snowflake/tests",
    "vision/tests",
    "web/tests",
]
