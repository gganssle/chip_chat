[project]
name = "chip-chat-search"
version = "0.0.0"
description = "The retrieval index: chunk schema, integrated vectorization, alias-swap rebuilds."
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.19",
    "chip-chat-harvest",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-harvest = { workspace = true }
