[project]
name = "chip-chat-agent"
version = "0.0.0"
description = "Foundry agent definition and tool implementations."
requires-python = ">=3.13"
dependencies = [
    "chip-chat-otel",
    # `match_meal_from_photo` is one of the eleven tools, and the whole of it
    # lives in `vision/`: stage 4 describes the photograph, stage 5 resolves
    # what it described to catalogue rows. `chip_chat.vision.lane` composes the
    # two into the one tool call RFC-001 section 09 draws. One way only --
    # `vision/` does not import back, which is what `describe.py` means when it
    # reads the Foundry variables itself rather than reaching into this package.
    "chip-chat-vision",
    # Foundry's model endpoint is OpenAI-shaped, so the OpenAI SDK's Azure
    # client is the supported path rather than a convenience.
    "openai>=1.60",
    "azure-identity>=1.19",
    # The photo lane reads uploads from ADLS Gen2. Shared keys are disabled on
    # that account, so there is no connection-string shortcut past this.
    "azure-storage-blob>=12.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-otel = { workspace = true }
chip-chat-vision = { workspace = true }
