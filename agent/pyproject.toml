[project]
name = "chip-chat-agent"
version = "0.0.0"
description = "Foundry agent definition and tool implementations."
requires-python = ">=3.13"
dependencies = ["chip-chat-otel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-otel = { workspace = true }
