[project]
name = "chip-chat-vision"
version = "0.0.0"
description = "Photo pipeline: validate, moderate, describe, match."
requires-python = ">=3.13"
dependencies = [
    "chip-chat-otel",
    "pillow>=11.1",
    "pillow-heif>=0.21",
    "azure-storage-blob>=12.24",
    "azure-identity>=1.19",
    "azure-ai-contentsafety>=1.0",
    # Stage 4 calls the Foundry vision deployment, whose model endpoint is
    # OpenAI-shaped, so the OpenAI SDK's Azure client is the supported path
    # rather than a convenience.
    "openai>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-otel = { workspace = true }
