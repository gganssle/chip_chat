[project]
name = "chip-chat-web"
version = "0.0.0"
description = "Chat widget and entry flow."
requires-python = ">=3.13"
dependencies = [
    "chip-chat-otel",
    # For the persona sentence on the entry page, and nothing else. The opening
    # message quotes the account's real balance rather than a second copy of it.
    "chip-chat-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-agent = { workspace = true }
chip-chat-otel = { workspace = true }
