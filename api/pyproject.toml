[project]
name = "chip-chat-api"
version = "0.0.0"
description = "FastAPI service, sessions, budget enforcement, ops API."
requires-python = ">=3.13"
dependencies = [
    "chip-chat-otel",
    # The agent this service puts a request path in front of, and the page it
    # serves. Both directions are one-way: neither imports back into api/.
    "chip-chat-agent",
    # The photo lane the gate hands to the agent. Named here as well as through
    # `chip-chat-agent` because this package imports `chip_chat.vision.lane`
    # directly, and a dependency reached only transitively is one a refactor
    # elsewhere can take away.
    "chip-chat-vision",
    "chip-chat-web",
    # The draft store prices from the catalogue and validates against it, so
    # `drafts.py` holds a `MenuCatalog`. Nothing else in this package does.
    "chip-chat-catalog",
    # `pool.py` spells the session variable it sets from
    # `chip_chat.snowflake.schema.SESSION_VARIABLE`, which is the same constant
    # `sql/10_policies.sql` compares against. A pool that set `DEMO` while the
    # policies read `DEMO_ID` would empty every table and look like a missing
    # load, so the name is imported rather than retyped -- and that is the whole
    # of what this dependency buys. No connection, no credentials, no driver.
    # The ops API calls the stored procedures of #46 and writes no SQL of its
    # own, so `ops.py` reads their names, argument order and arity off
    # `chip_chat.snowflake.procedures`. A declaration, not a driver: nothing in
    # this package opens a Snowflake connection, and `WriteBackend` is the seam
    # where the Functions host supplies one.
    "chip-chat-snowflake",
    # The driver, and the one line in this file that reverses a decision the
    # repository had written down. The root `pyproject.toml` argued -- correctly
    # -- that `snowflake-connector-python` belonged in
    # `api/functions/requirements.txt` and nowhere else, because nothing in the
    # workspace imported it and adding it would put a large dependency into every
    # developer's virtualenv to satisfy a file no test ran. That argument held for
    # exactly as long as `build_service` was called with `connect=None`.
    # `chip_chat.api.connect` now opens the read connection the pool hands out, so
    # the deployed image imports the driver on the conversational path and a
    # dependency it is not allowed to declare is a dependency that is missing.
    # `api/tests/test_connect.py` runs against the adapter without it; the import
    # is inside the factory, so `make ci` still does not need an account.
    "snowflake-connector-python>=3.12",
    # How the private key reaches a process that has no file system worth writing
    # one to. The deployed container is handed the key as a Container Apps secret
    # sourced from Key Vault, so this is the *second* path and not the first --
    # see `chip_chat.api.connect.KeyVaultKey` for when each is taken, and why the
    # vault is never read on the start-up path.
    "azure-keyvault-secrets>=4.9",
    "fastapi>=0.115",
    # [standard] brings httptools and uvloop. The container runs one process
    # with a handful of workers; the difference is not academic there.
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-agent = { workspace = true }
chip-chat-catalog = { workspace = true }
chip-chat-otel = { workspace = true }
chip-chat-snowflake = { workspace = true }
chip-chat-vision = { workspace = true }
chip-chat-web = { workspace = true }
