[project]
name = "chip-chat-api"
version = "0.0.0"
description = "FastAPI service, sessions, budget enforcement, ops API."
requires-python = ">=3.13"
dependencies = [
    "chip-chat-otel",
    # The agent this service puts a request path in front of, and the page it
    # serves. Both directions are one-way: neither imports back into api/.
    "chip-chat-agent",
    "chip-chat-web",
    # The draft store prices from the catalogue and validates against it, so
    # `drafts.py` holds a `MenuCatalog`. Nothing else in this package does.
    "chip-chat-catalog",
    "fastapi>=0.115",
    # [standard] brings httptools and uvloop. The container runs one process
    # with a handful of workers; the difference is not academic there.
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_chat"]

[tool.uv.sources]
chip-chat-agent = { workspace = true }
chip-chat-catalog = { workspace = true }
chip-chat-otel = { workspace = true }
chip-chat-web = { workspace = true }
