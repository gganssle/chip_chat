name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, imports, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: make setup

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Import contracts
        run: make imports

      - name: Tests
        run: make test

      # Issue #30's fourth acceptance criterion. Neither step calls a model.
      #
      # The first blocks: a suite that is no longer the suite #30 asked for --
      # a family with no attack, a write tool nothing aims at, a requirement the
      # golden set delegated here and nobody covered -- is a build failure, or
      # it stays a gap.
      #
      # The second does not block, and the reason is worth reading before
      # anybody deletes the flag. `make adversarial` exits non-zero while EITHER
      # launch gate is unmeasured, and the first gate is unmeasurable against
      # this deployment by construction: one hardcoded account cannot disclose
      # across visitors. That will stay true until #43 and #44 land the identity
      # path, so a blocking step here would be red on every pull request for
      # months and would be switched off within a week.
      #
      # What is NOT waived is a breach. `make test` runs the suite against the
      # slice and against the fixtures, and eval/tests/test_adversarial_slice.py
      # asserts the write gate is at zero breaches -- so an actual failure fails
      # the build in the step above this one. This step exists so the report is
      # in the log where a person reads it, and `continue-on-error` is used
      # rather than `|| true` so that its non-zero exit stays visible in the UI
      # instead of being swallowed.
      - name: Adversarial suite -- is it the suite #30 asked for
        run: make adversarial-check

      - name: Adversarial suite -- the gates against a compliant model
        run: make adversarial
        continue-on-error: true

      # Issue #74. Neither step calls a model.
      #
      # The first blocks: a dataset that cannot support the report's claims --
      # a lane with no rows, no boundary rows to make a wrong lane nameable, no
      # row where a wrong query is observable -- is a gap in what can be
      # measured, and a gap nobody fails on is a gap that stays.
      #
      # The second runs the trajectory eval against the week-one slice with
      # lane selection handed to it. It gates on exactly one thing: a turn that
      # arrived as more than one trace. That is #103's propagation, it is
      # invisible otherwise -- every tool span is still present, just attached
      # to a trace the turn knows nothing about -- and it would make every
      # number in the document a measurement of half a tree.
      #
      # What is NOT gated is the accuracy. The slice registers six of the
      # eleven tools, so its ceiling is 68.8% against a 95% target by
      # construction, and a step that is red on every pull request until the
      # remaining lanes land is a step somebody switches off. The report goes
      # to stdout rather than to the baseline file, so the log holds it and the
      # checkout stays clean -- `make trajectory-baseline` is the writing one.
      - name: Trajectory eval -- can the dataset carry #74's numbers
        run: make trajectory-check

      - name: Trajectory eval -- one turn, one trace
        run: make trajectory

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          # The wrapper rewrites stdout and breaks the exit code of fmt -check.
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      # -backend=false because validate needs the providers but must not reach
      # for remote state, which would want Azure credentials CI does not have.
      # The committed lock file is what makes this reproducible.
      - name: Init
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=infra/terraform validate

      - name: Shellcheck the bootstrap script
        run: shellcheck infra/scripts/bootstrap-state.sh
