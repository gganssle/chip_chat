name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, imports, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: make setup

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Import contracts
        run: make imports

      - name: Tests
        run: make test
